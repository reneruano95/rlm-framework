# Derived from the repo's config.yaml -- do not hand-edit.
#
# This is the config the PACKAGE ships with, so a copied `rlm/` can be imported
# and its suite run with no repo present. TEN leaves differ from the real
# config, and only those ten: the three server `model` paths, their
# `backend_dir`s, the root `dflash` flag AND its `extra_flags` list, and the sandbox
# `interpreter` and `bootstrap_dir`. Everything else -- budgets, chunk sizes, prompt slots,
# checkers, dispatch policy -- is byte-for-byte the shipped structure, which is
# what `checks/test_default_config.py` asserts so the two cannot drift apart.
#
# The placeholders are not runnable. Nothing in the shipped suite launches a
# server; a consumer that wants to run one overrides these ten values.
servers:
  root:
    model: models/root.gguf
    mtp: false
    dflash: false
    port: 8080
    backend: vulkan
    backend_dir: llama.cpp
    log_path: traces/logs/root-server.log
    ctx: 32768
    parallel: 1
    cache_type: q8_0
    flash_attn: 'on'
    ub: 512
    b: 2048
    extra_flags:
    - -lm none
    - --no-context-shift
  leaf:
    model: models/leaf.gguf
    port: 8081
    backend: vulkan
    backend_dir: llama.cpp
    log_path: traces/logs/leaf-server.log
    ctx: 327680
    parallel: 128
    slot_policy: never_reuse
    cache_type: q8_0
    flash_attn: 'on'
    ub: 512
    b: 2048
    extra_flags:
    - -lm none
    - --no-kv-unified
    - --cont-batching
    - --cache-ram 0
    - -ctxcp 0
  bench_leaf:
    model: models/bench_leaf.gguf
    port: 8081
    backend: vulkan
    backend_dir: llama.cpp
    log_path: traces/logs/leaf-server-bench.log
    ctx: 524288
    parallel: 2
    cache_type: q8_0
    flash_attn: 'on'
    ub: 512
    b: 2048
    per_call_timeout_s: 900
    extra_flags:
    - -lm none
    - --no-kv-unified
    - --cache-ram 0
    - -ctxcp 0
  fallback_leaf: null
scaffold:
  dispatcher: real
  chunk:
    size_tokens: 640
    stride_tokens: 480
    overhead_tokens: 1920
    snap_to_boundary: true
    snap_tolerance: 0.1
  truncation_cap_chars: 2000
  budgets:
    max_depth: 1
    max_subcalls: 926
    max_wall_clock_s: 1300
    restricted_max_wall_clock_s: 2100
    max_total_tokens: 1500000
    max_identical_turns: 3
    max_predict:
      root: 1024
      leaf: 512
  retries:
    max_attempts: 3
    backoff_s:
    - 1
    - 4
    per_call_timeout_s: 240
  root_window_kill_fraction: 0.9
  sampling:
    root:
      temperature: 0.7
      top_p: 0.8
      seed: 1
    leaf:
      temperature: 0.3
      top_p: 0.9
      seed: 1
  prompts:
