[project]
name = "rlm-halo"
version = "0.1.0"
description = "Local Recursive Language Model runtime (rlm-runtime-spec v0.3.16)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.scripts]
rlm = "rlm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    # Latency regressions here are correctness regressions: an operator abort
    # that unwinds before killing takes 30 s (the shutdown grace, twice)
    # instead of returning immediately, and without a bound that failure mode
    # reads as "slow test" rather than "the kill ordering broke".
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

# The editable install must put BOTH the repo root and `src/` on sys.path.
# `src/` is what makes `import rlm` resolve; the repo root is what makes
# `import bench` resolve, and `rlm bench` needs it at RUNTIME -- `rlm/bench.py`,
# `rlm/cli.py` and `rlm/verdict.py` take `bench.manifest` as a function-local
# import precisely because `bench/` is deliberately NOT in the wheel (see
# `src/rlm/bench.py`'s module docstring and `tests/test_import_rules.py`).
# `milestones/s1/` and `milestones/s2/` resolve the same way -- `bench/vocab.py` imports both at
# module import time, which is why those directories cannot be archived.
dev-mode-dirs = [".", "src"]
