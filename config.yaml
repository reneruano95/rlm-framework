# rlm-halo runtime config (spec ARCHITECTURE.md §5, Appendix A).
# Validated by rlm.config.Config (pydantic, extra="forbid"). config_snapshot()
# is the canonical JSON dump of the validated model (stable field order).
#
# Prompt files under prompts/ (Task 14) are pinned by sha256 below — see
# rlm/config.py's PromptRegistry and Config.pinned_prompt_hashes() docstrings.
# A drifted or deleted file fails load_config() loudly (Config's
# cross-field validator hashes the file on every load).

servers:
  root:
    model: 'D:\AI\models\unsloth\Qwen3.6-27B-GGUF\Qwen3.6-27B-Q4_K_M.gguf'
    mtp: false
    port: 8080
    backend: vulkan
    backend_dir: 'D:\PROJECTS\rlm-halo-framework\tools\llamacpp-vulkan'
    log_path: traces/logs/root-server.log
    ctx: 32768
    parallel: 1
    cache_type: q8_0
    flash_attn: "on"
    ub: 512
    b: 2048
    # `-lm none` IS §4's `--no-mmap`: b10375 deprecates `--mmap/-mmp` in favour
    # of `--load-mode` (R11 flag drift). These are the flags the S1 gate
    # actually launched with, recorded here so config_snapshot describes the
    # servers that ran rather than the ones the spec was written against.
    # `-lv 4` is a launch-contract requirement, not an extra flag: D27's
    # cache-type assertion parses the log it produces.
    extra_flags: ["-lm none", "--no-context-shift"]
  leaf:
    model: 'D:\AI\models\unsloth\Qwen3.6-35B-A3B-GGUF\Qwen3.6-35B-A3B-UD-Q4_K_M.gguf'
    port: 8081
    backend: rocm
    backend_dir: 'D:\PROJECTS\rlm-halo-framework\tools\llamacpp-rocm'
    log_path: traces/logs/leaf-server.log
    ctx: 327680
    # MEASURED AND PINNED 2026-08-13 (`s2/R13-slotcount.md`). `-np 128
    # -c 327680` = 2,560 tok/slot, 128 windows per leaf process, 2 rotations
    # per 200K-token corpus. The two memory axes separate cleanly: KV is priced
    # by the TOKEN budget (3,400 MiB at every `-np`, 10.625 KiB/token at q8_0)
    # and recurrent state by SLOT COUNT (62.8125 MiB/slot = S 60.000 + conv R
    # 2.8125, context-independent from 40,960 down to 1,280 tok/slot). At 128
    # that is 8,040 MiB of recurrent state, 32.244 GiB leaf residency and
    # 51.53 GiB dual-resident of the 64 GiB carve -- 19.5% free, above the
    # stated 15% floor -- for -1.37% prefill / +0.12% decode.
    # 128 is the LARGEST pool that fits, on two independent grounds: `-np 192`
    # lands at 13.4% margin (under the floor) and gives 1,706 tok/slot against
    # the ~1,900 the 1024/768 geometry needs. `-np 64` is the named fallback
    # and is strictly worse here (4 rotations, plus a reproducible +629 MiB of
    # unaccounted allocation at that size).
    parallel: 128
    # R13 (§10, §5 C4). The only measured-clean policy, and the only supported
    # value: one never-reused slot per window, both questions about a window on
    # that window's slot, a server restart when the pool is exhausted.
    slot_policy: never_reuse
    cache_type: q8_0
    flash_attn: "on"
    ub: 512
    b: 2048
    extra_flags: ["-lm none", "--no-kv-unified", "--cont-batching"]
  fallback_leaf: null

scaffold:
  dispatcher: real
  # §7 #2 (v0.2.5): WINDOW 1,024 / STRIDE 768 (25% overlap). Retrieval does not
  # degrade with chunk size -- it falls off a cliff at absolute needle-to-
  # question DISTANCE (38/39 correct within ~1,000 tokens, 0/39 beyond;
  # bracket [967 pass, 1022 fail]). A 32,768-token chunk with the needle 967
  # from the end scored 6/6 while a 1,024-token chunk with it 1,022 from the
  # end scored 0/3, so `size_tokens: 1024` alone would still leave the HEAD of
  # every chunk outside the horizon: the geometry is the fix, not the size.
  # This stride puts every token within 768 tokens of the end of some window
  # containing it, at the same sub-call count as non-overlapping 768-chunking
  # and ~24% more prefill.
  #
  # overhead_tokens RE-DERIVED 8192 -> 1536 so that window + overhead = 2,560,
  # R13's measured dense-slot budget (`-np 128 -c 327680`): 128 x 2,560 is
  # exactly servers.leaf.ctx, so this block is arithmetic-ready for the `-np`
  # §4 requires to be measured before pinning. It covers the rendered leaf
  # prefix (311 tokens measured), the question, the chat template's markup,
  # max_predict.leaf (512) and the ±10% snap slack on the window.
  chunk: { size_tokens: 1024, stride_tokens: 768, overhead_tokens: 1536, snap_to_boundary: true, snap_tolerance: 0.10 }
  truncation_cap_chars: 2000
  budgets:
    max_depth: 1
    # RAISED 32 -> 522 (s2/R13-mitigations.md §8.3). At §7 #2's window 1,024 /
    # stride 768, a 200,000-token corpus is
    #     windows = ceil((200,000 - 1,024) / 768) + 1 = 261
    # and the budget is spent per QUESTION, so a full pass at 2 questions per
    # window is 261 x 2 = 522 subcalls. The old 32 covered
    # 1,024 + 31 x 768 = 24,832 tokens = 12.4% of such a corpus, and the
    # shortfall showed up as quietly partial coverage, never as a breach.
    # The other two budgets are checked against the same pass and stand:
    # ~590K prompt tokens against max_total_tokens 1.5M, and 11.9 min of leaf
    # work against max_wall_clock_s 900 (which leaves under 4 min for root
    # turns -- re-derive it when §7 #2's geometry actually lands).
    # HEADROOM CHECKED AGAINST §8's DECLARED TASK SIZES 2026-08-13, and the
    # top of the needle category ("200K-1M chars") does NOT fit. At the 3.7727
    # chars/token measured over the S2 fixture corpus, 1M chars = 265,060
    # tokens = 345 windows = 690 subcalls at 2 questions per window:
    #   max_subcalls 522        BREAKS FIRST, at 75.7% coverage, ~715 s in --
    #                           and it breaks SILENTLY as partial coverage in
    #                           the one category that punishes sampling.
    #   max_wall_clock_s 900    BREAKS SECOND (~955 s incl. 2 rotations) if
    #                           max_subcalls is raised. S0's own rule already
    #                           says the 15-min default is valid only to
    #                           ~250K tokens, so this is out of its stated
    #                           scope rather than a surprise.
    #   max_total_tokens 1.5M   HOLDS: 1.02M expected, 1.31M worst case.
    # NOT raised here: 690 subcalls would only move the breach to the wall
    # clock, and the wall clock is a §9/§8 per-task-size-class derivation, not
    # a config knob to turn quietly. The low end of the range is comfortable
    # (200K chars = 138 subcalls, 189 s).
    max_subcalls: 522
    max_wall_clock_s: 900
    max_total_tokens: 1500000
    # S1 re-derivation (§9 S1, s1/RESULTS.md): observed root answer lengths
    # max 388 tokens over 55 turns -- root 1024 is comfortable and unchanged.
    # The leaf distribution (n=9: 1,1,7,7,7,7,7,31,35) is NOT usable: every
    # one of those calls came from the untemplated leaf path (finding F3), so
    # lowering leaf max_predict on it would bake a defect into config. Stays
    # 512; re-derive at S2 once leaf calls carry a chat template.
    max_predict: { root: 1024, leaf: 512 }
  retries: { max_attempts: 3, backoff_s: [1, 4], per_call_timeout_s: 240 }
  root_window_kill_fraction: 0.90
  sampling:
    root: { temperature: 0.7, top_p: 0.8, seed: 1 }
    leaf: { temperature: 0.3, top_p: 0.9, seed: 1 }
  prompts:
    # S1 R1 A/B DECIDED 2026-08-13 (s1/RESULTS.md): root.v1 (tips-only) vs
    # root.v2 (tips + two worked exemplars), 3 attempts each on both S1
    # fixtures. Result 6/6 vs 6/6 -- a tie at ceiling, no discrimination. The
    # pre-registered tie-break keeps the SIMPLER prompt: v2 buys +1,203 root
    # prompt tokens per episode (1,664 -> 2,867 measured on turn 1) for zero
    # measured benefit, and a tie is not evidence for the exemplars. The A/B is
    # CLOSED at two variants (§9 S1 hard cap) and neither arm was ever edited.
    #
    # PINNED PROMPT IS root.v3 SINCE 2026-08-13 (§7 #2, "the layout fix is inert
    # in production"). v3 IS the A/B winner: it is root.v1.md byte-for-byte
    # except that its three API lines teach `llm_query(question, chunk=...)`,
    # the kwarg C4 uses to compose [prefix][chunk][question] itself (chunk-first
    # re-query cache_n=546 vs question-first 0). v1 stayed pinned through S1 and
    # taught the hand-composed single string, so the running root emitted
    # chunk=None on every call and §7 #3's gate (b) would have scored a root
    # never taught the API it is graded on. v1/v2 remain on disk, unmodified and
    # unpinned, as the recorded S1 arms; s1/run_s1.py re-pins them itself.
    root: { path: prompts/root.v3.md, sha256: 3fb653e3eacafa50b53d12c08cc70982fe4a6ad19bf01cffbf7966771917b6b6 }
    # LEAF PREFIX: v1 REMAINS PINNED pending the S2 refusal A/B
    # (`s2/REFUSAL-AB.md`). v2 exists on disk, unmodified and unpinned, as the
    # refusal-strengthened arm; v1 is the control behind every leaf measurement
    # recorded so far -- including the 95% false-positive rate the A/B exists to
    # attack -- and is never edited. Whichever arm wins is pinned HERE, once,
    # with the measurement cited.
    leaf_prefix: { path: prompts/leaf-prefix.v1.md, sha256: dfaddb37a24594724709d36dbb117fc1b12bfa436229322d4d5ebf46625d0f76 }
    # The envelope's format block, appended to whichever prefix is pinned. Its
    # own file and its own hash so the 2x2 (prefix x envelope) varies on two
    # independent axes and neither prefix carries the format. Declared and
    # hash-pinned even while `scaffold.leaf_envelope.enabled` is false, so a
    # drifted or deleted block is refused at config load rather than at the
    # moment someone flips the switch.
    leaf_envelope: { path: prompts/leaf-envelope.v2.md, sha256: 58d813fa36766e4ea9800b9004577d31b6d71fcbb26d38f4b0ef83d911d12867 }
    strategy_templates:
      needle: { path: prompts/strat-needle.v1.md, sha256: 6203a30dec3fa8280a222b636ae7ef0b65fa01212d416c95ad6c0d1104e0e11d }
      # PINNED v2 SINCE 2026-08-13. v1 was authored against a PARTITIONING
      # chunker; §7 #2's window 1,024 / stride 768 makes `chunks` overlapping
      # windows, so ~25% of the corpus sits in two of them and v1's reduction
      # step ("deduplicate across chunks, then count") double-counts, while its
      # boundary-stitching tip manufactures a phantom copy of every item the
      # overlap already covers. §8 requires this category to force coverage and
      # punish sampling, so the counting guidance has to match the geometry the
      # chunker actually ships. v1 stays on disk, unmodified and unpinned, as
      # the recorded text of every run made before this date.
      aggregation: { path: prompts/strat-aggregation.v2.md, sha256: 4baeea34d2dda4a5b1022ed5fa2366c6a6d78161238482526820eb8d34bb35fa }
      synthesis: { path: prompts/strat-synthesis.v1.md, sha256: ed974f736e7d8873a162f0419512d0b9b4ccb5830299b54c72444a62382ab56c }
      code_qa: { path: prompts/strat-codeqa.v1.md, sha256: 54f99dc59013686b8b8b7323293fc834c20fea4a95cbf8dc9ccbba298ae32c2e }
      default: { path: prompts/strat-default.v1.md, sha256: f4d12908276113309aab07283ef8cb096b4d8d53e14c8bd794a9b4999a6b7415 }
  # DECIDED BY THE S2 A/B (`s2/REFUSAL-AB.md`), not by taste. `enabled` appends
  # the format block to the leaf prefix and makes C4 parse/validate the reply
  # scaffold-side; `grammar` is the SEPARATE server-side enforcement flag and is
  # never trusted even when on -- llama.cpp has documented silent fail-open on
  # schema-parse failure (§13), so scaffold-side validation runs identically
  # either way.
  leaf_envelope: { enabled: false, grammar: false }
  sandbox:
    # MUST be the real base interpreter, never the venv's Scripts\python.exe
    # trampoline (262 KB stub that re-execs the real interpreter as a CHILD
    # with a DIFFERENT pid -- measured on this box, Popen.pid != child's own
    # os.getpid()). Recording the trampoline's pid as episodes.sandbox_pid
    # would be wrong, would race job.assign against the trampoline's own
    # re-exec (Cross-check Conflict 1/7), and would make TerminateJobObject
    # target the wrong process. Absolute path, pinned, never sys.executable.
    interpreter: 'C:\Users\Rene\AppData\Roaming\uv\python\cpython-3.12.11-windows-x86_64-none\python.exe'
    bootstrap_dir: 'D:\PROJECTS\rlm-halo-framework\sandbox_bootstrap'
    network_isolation: appcontainer
    appcontainer_per_episode: true
    deny_ctypes: false
    memory_limit_mb: 4096
    active_process_limit: 1
  root:
    enable_thinking: false
    window_tokens: 32768
  leaf:
    # S1 F3: every leaf reply in the gate was an empty `<think></think>` block
    # (the untemplated leaf path). At chunk scale the reasoning trace is decode
    # cost the root never reads, and the hand-run probe with thinking ON never
    # reached an answer inside 512 tokens. Off, like the root's.
    enable_thinking: false
  # NOT `servers.leaf.parallel`, and no longer required to equal it (v0.2.6).
  # Under never-reuse the two measure different things: `--parallel` is the
  # POOL -- how many windows one leaf process can serve before it is rotated,
  # sized by the measured 62.8125 MiB/slot memory bill -- while this is how
  # many leaf calls may be in flight at once, sized by S0's finding that
  # aggregate prefill is FLAT across slots (946.7 t/s at 8 ≈ 943.4 at 1).
  # Tying them would put 128 calls on the wire because the memory allowed 128
  # slots. 8 is the measured value and stands; it may not exceed the pool,
  # since every in-flight call holds a slot.
  dispatch_concurrency: 8

trace:
  db_path: traces/rlm.duckdb
  blob_root: traces/blobs
  export_every_episode: true

benchmark: { version: null, seeds: [1, 2, 3] }
power_sampling: { enabled: false }
